[project]
name = "juku-mcp"
version = "0.0.0"
description = "Juku's MCP server: the learner's data, scoped by a verified delegation token, read-only"
requires-python = ">=3.12,<3.13"
dependencies = [
    "juku-common",
    "juku-data",
    "mcp==2.3.0",
    "opentelemetry-api==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "pydantic-settings==2.16.1",
    "typer==0.27.3",
    "uvicorn==0.54.0",
]

[project.scripts]
juku-mcp = "juku_mcp.cli:app"

[tool.uv.sources]
juku-common = { workspace = true }
juku-data = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/juku_mcp"]
