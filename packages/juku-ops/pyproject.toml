[project]
name = "juku-ops"
version = "0.0.0"
description = "Juku's operations jobs: the audit-log importer, the heartbeat and job-run records"
requires-python = ">=3.12,<3.13"
dependencies = [
    "juku-common",
    "juku-data",
    "alembic==1.20.0",
    "asyncpg==0.32.0",
    "httpx==0.28.1",
    "pydantic-settings==2.16.1",
    "sqlalchemy[asyncio]==2.1.4",
    "typer==0.27.3",
]

[project.scripts]
juku-ops = "juku_ops.cli:app"

[tool.uv.sources]
juku-common = { workspace = true }
juku-data = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/juku_ops"]

[tool.mutmut]
# Run from this folder: `uv run --frozen mutmut run`. The tests need `make db-up`.
source_paths = ["src/juku_ops/"]
do_not_mutate = ["src/juku_ops/cli.py", "src/juku_ops/tables.py", "src/juku_ops/settings.py"]
pytest_add_cli_args_test_selection = ["tests/"]
