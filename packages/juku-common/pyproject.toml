[project]
name = "juku-common"
version = "0.0.0"
description = "What every Juku service shares: the rule file, the audit log and the delegation tokens"
requires-python = ">=3.12,<3.13"
dependencies = ["cryptography==50.0.2", "pydantic==2.14.1", "pyjwt==2.15.1", "pyyaml==6.0.3"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/juku_common"]

[tool.mutmut]
# Run from this folder: `uv run --frozen mutmut run`.
source_paths = ["src/juku_common/"]
pytest_add_cli_args_test_selection = ["tests/"]
