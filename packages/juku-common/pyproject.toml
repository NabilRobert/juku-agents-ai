[project]
name = "juku-common"
version = "0.0.0"
description = "What every Juku service shares: the rule file and the hash-chained audit log"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic==2.14.1", "pyyaml==6.0.3"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/juku_common"]
