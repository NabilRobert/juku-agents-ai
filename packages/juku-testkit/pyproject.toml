[project]
name = "juku-testkit"
version = "0.0.0"
description = "Juku's shared test helpers: the fitness-function harness and the test databases (dev only)"
requires-python = ">=3.12,<3.13"
dependencies = ["juku-common", "juku-data", "alembic==1.20.0", "asyncpg==0.32.0", "pytest==9.1.1", "sqlalchemy[asyncio]==2.1.4"]

[project.entry-points.pytest11]
juku_fitness = "juku_testkit.fitness"
juku_databases = "juku_testkit.databases"
juku_guardrails = "juku_testkit.guardrails"
juku_tracing = "juku_testkit.tracing"

[tool.uv.sources]
juku-common = { workspace = true }
juku-data = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/juku_testkit"]
