[project]
name = "juku-data"
version = "0.0.0"
description = "Juku's data and learning engine: the OpenJLPT load, learner state, and the deterministic engine (LE1-LE6)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "juku-common",
    "asyncpg==0.32.0",
    "httpx==0.28.1",
    "jaconv==0.5.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "sqlalchemy[asyncio]==2.1.4",
    "sudachidict-core==20260723.1",
    "sudachipy==0.7.0",
    "typer==0.27.3",
]

[project.scripts]
juku-data = "juku_data.cli:app"

[tool.uv.sources]
juku-common = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/juku_data"]

[tool.mutmut]
# Run from this folder: `uv run --frozen mutmut run`. Only the pure rules: the
# database-backed modules would rebuild the test databases for every mutant,
# so their rules are mutation-checked by hand instead (JOURNEY.md, track A).
source_paths = ["src/juku_data/"]
do_not_mutate = [
    "src/juku_data/__init__.py",
    "src/juku_data/cli.py",
    "src/juku_data/settings.py",
    "src/juku_data/synthetic.py",
    "src/juku_data/dictionary/*",
    "src/juku_data/engine/__init__.py",
    "src/juku_data/engine/api.py",
    "src/juku_data/engine/models.py",
    "src/juku_data/engine/plans.py",
    "src/juku_data/engine/quiz.py",
    "src/juku_data/engine/reads.py",
    "src/juku_data/engine/recompute.py",
    "src/juku_data/engine/writes.py",
    "src/juku_data/memory/__init__.py",
    "src/juku_data/memory/models.py",
    "src/juku_data/memory/store.py",
]
pytest_add_cli_args_test_selection = [
    "tests/test_state_rules.py",
    "tests/test_japanese.py",
    "tests/test_memory_evidence.py",
]
