# guardrails.yaml: every limit Juku enforces, in one reviewed file (ADR-019).
#
# Services load it at start-up (packages/juku-common/src/juku_common/rules.py)
# and refuse to start if it is invalid. Raising a limit is a visible change
# in a pull request, never a silent edit. Each rule has a test that fails
# when the rule is removed (Phase 1, G1).
version: 1

# When Arthur is alerted (Phase 2 M5). The Grafana rules in
# ops/grafana/provisioning/alerting/rules.yaml use these numbers; a test
# keeps them equal.
alerts:
  heartbeat_stale_seconds: 300
  tool_error_rate_per_hour: 0.05

# Privacy floors (Phase 2 EV2, M4): no aggregate, on a dashboard or in
# published evidence, covers fewer learners than this.
privacy:
  min_learners_per_cell: 5

# Agent identity and delegation (ADR-018; Phase 2 ID-R1 to ID-R4). Every
# MCP call carries a single-use token, signed by the app, naming the
# learner, the chain of agents acting for them, and the tools allowed.
delegation:
  issuer: juku-app
  audience: juku-mcp
  token_ttl_seconds: 60
  # learner -> Shiori -> Keiko is the longest chain; anything deeper is refused.
  max_agent_hops: 2
  # Behind the gateway, the chain's current agent must be the one whose key made the call.
  require_gateway_caller: true
  # The one multi-hop path: Shiori asks Keiko for a new plan through request_replan.
  allowed_delegations:
    - {from_agent: shiori, to_agent: keiko, via_tool: request_replan}

# Which of Juku's MCP tools each agent's tokens may name (ID-R1). The
# gateway's policy file holds the same lists for its allow-lists; Nikki and
# Tadashi work only from what they're given, so they have none.
agents:
  shiori:
    - get_progress
    - get_mistakes
    - recommend_words
    - find_reading_sentences
    - get_plan
    - get_recent_activity
    - get_memory
    - search_words
    - request_replan
  keiko:
    - get_progress
    - get_mistakes
    - recommend_words
    - find_reading_sentences
    - get_plan
    - get_recent_activity
    - get_memory
  nikki: []
  tadashi: []

# The one action tool (SM4): it only queues a Keiko run, and at most this
# many a day per learner (their local day).
replan:
  max_requests_per_day: 1

# Fitness functions (scale path, ADR-023): automated checks that fail the
# build when a change degrades a quality the design depends on. `pending`
# ones name the slice that activates them; the harness lists them as
# missing rather than skipping them silently.
fitness:
  FF1:
    title: Query plans on a synthetic 5,000-learner database
    status: active
    thresholds:
      # ADR-010's latency rule, for the learner who knows 4,000 words.
      recommend_words_max_ms: 200
      # A sequential scan of an event partition with more rows than this fails.
      max_event_seq_scan_rows: 1000
      # Plan-cost ceilings for the 4,000-word learner, about twice the cost
      # measured on 2026-10-28 (in brackets). A query whose plan gets worse
      # fails here; raising a ceiling is a reviewed change to this file.
      cost_recommend_words: 5000     # (2,591)
      cost_coverage: 2000            # (948)
      cost_known_count: 14000        # (6,857)
      cost_known_ids: 14000          # (6,847)
      cost_mistakes: 600             # (263)
      cost_recent_activity: 50       # (19)
      cost_reading_sentences: 6000   # (2,695)
      cost_quiz_due_items: 50        # (12)
      cost_quiz_in_progress: 14000   # (6,871)
  FF2:
    title: Hot paths read summaries only, never learning_events
    status: active
  FF3:
    title: Incremental state equals a full recompute
    status: active
  FF4:
    title: Migrations are safe (Squawk)
    status: active
    checked_by: squawk
  FF5:
    title: MCP tool schemas match their snapshots
    status: pending
    until: track B (slice 3)
  FF6:
    title: Prompt and context token ceilings
    status: pending
    until: slice 6 (the pipeline)
  FF7:
    title: Idempotent weekly runs
    status: pending
    until: slice 6 (the pipeline)
  FF8:
    title: Guardrail, delegation and isolation suites
    status: pending
    until: track B (slice 3)
  FF9:
    title: No content in records, traces or logs
    status: active
  FF10:
    title: Load test against the recorded baseline
    status: pending
    until: the load test (Should)
    checked_by: locust
  FF11:
    title: Agent quality (the harness regression gate)
    status: pending
    until: slice 7 (paid evals, with Arthur's OK)
    checked_by: agent-eval-harness
  FF12:
    title: Frontend budget (Lighthouse CI, mobile)
    status: pending
    until: track C (slice 5)
    checked_by: lighthouse-ci
  FF13:
    title: Tool query plans stay under their cost ceilings, with JIT off
    status: active
    thresholds:
      # Postgres's jit_above_cost default: below it, JIT never compiles a
      # plan, even if `jit = off` were lost from Juku's MCP role (spike 2).
      jit_above_cost: 100000
