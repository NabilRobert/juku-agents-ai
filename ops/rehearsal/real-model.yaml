# Arthur's own use of the laptop stack, on top of compose.yaml and rehearsal/compose.yaml: the model's
# real address again (settings.py's default), with his OK of the chat spend (2026-11-05: about $0.0023 a
# question, at most about $0.05 a day under guardrails.yaml's 20 questions a day).
#
# It spends only with a real key in ops/secrets/juku_model_api_key (copy JUKU_MODEL_API_KEY from .env into
# it). rehearse.sh never loads this file and empties that key on every `up`, so a rehearsal still can't spend.
services:
  app:
    environment:
      JUKU_MODEL_BASE_URL: https://ai.sumopod.com/v1
