# Alembic, for the `app` database. One environment, one branch per owner:
#   monitoring  per-call records, audit imports, heartbeats (track D)
#   data        learners, events and the learning engine's summaries (track A)
#   app         consent, invite codes, chat text and budgets (track C)
# `alembic upgrade heads` runs them all. The `dict` database isn't migrated:
# it's rebuilt from the pinned OpenJLPT file by `juku-data load-dictionary`.
[alembic]
script_location = %(here)s/migrations
version_locations = %(here)s/migrations/versions/monitoring %(here)s/migrations/versions/data
path_separator = space
# The URL comes from $JUKU_MIGRATOR_DATABASE_URL (see migrations/env.py), never from this file.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = WARNING
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
