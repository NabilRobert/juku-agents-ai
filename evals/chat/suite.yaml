# Q1: the offline chat task set, about 40 tasks (Phase 1 Q1), with answers
# checkable from the data. Same format as evals/memory/suite.yaml: each prompt
# goes to Shiori for the task's fixture learner, and the answer is graded by
# `answer_match` and `required_tools` in agent-eval-harness.
#
# Juku's own fields, used by the $0 test (packages/juku-mcp/tests/test_chat_tasks.py)
# and ignored by the harness:
#   learner         the fixture learner, from evals/memory/learners or evals/pipeline/learners;
#   reference_sql   the gold answer, from SQL over the fixture data, not from the tools;
#   expected        the rows reference_sql returns;
#   tool_arguments  what a tool needs to be called with (only search_words takes any);
#   facts / absent  strings the tools' output must / must not contain.
# Word IDs are OpenJLPT's, from the pinned build. The week is Monday 2 to Sunday
# 8 November 2026. `abstention` tasks have no data to answer from: AG5 says the
# answer must then say so, not guess.
suite: juku-chat
version: 1
target: juku
description: Shiori answering from the learner's data, on the ten fixture learners. Gold answers from SQL over the
  fixtures.
fixture:
  now: '2026-11-08T20:00:00+07:00'
