# Spike 3: Grafana OSS idle memory, with a provisioned Postgres data source
# and one dashboard. Local only. The network is internal, so neither
# container can reach the internet (no plugin downloads, no update checks).
name: juku-spike3

networks:
  spike3:
    internal: true

services:
  db:
    image: postgres:16
    networks: [spike3]
    environment:
      # Local throwaway database on an internal network with no published port.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  grafana:
    image: grafana/grafana:13.2.4
    networks: [spike3]
    depends_on:
      db: {condition: service_healthy}
    mem_limit: ${GRAFANA_MEM_LIMIT:-256m}
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/admin_password
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_LOG_LEVEL: warn
      # Optional: a soft heap target for Go's garbage collector (empty = off).
      GOMEMLIMIT: ${GOMEMLIMIT:-}
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - ${ADMIN_PASSWORD_FILE:?generate one with measure.sh}:/run/admin_password:ro
