# gitleaks: the default rules, plus the paths that hold hashes, not secrets.
[extend]
useDefault = true

[allowlist]
description = "Spike evidence: sha256 hashes of throwaway test tokens and audit-line hashes, not secrets"
paths = [
    '''docs/planning/spikes/6-delegation-chain/results/logs/.*\.jsonl''',
    '''docs/planning/spikes/6-delegation-chain/results/results-.*\.json''',
    '''packages/juku-mcp/attacks/logs/.*\.jsonl''',
    '''uv\.lock''',
]

# Known false positives in code that moves between branches, matched on the
# whole line (fingerprints carry line numbers, which differ across the stack):
regexTarget = "line"
regexes = [
    # A parameter typed as an Ed25519 key, not a key: `key: ed25519.Ed25519PrivateKey`.
    '''key: ed25519\.Ed25519\w+Key''',
    # The deliberately invalid PEM in the key-loading tests: base64 for "not a key".
    '''bm90IGEga2V5''',
    # Spike 6's write-up, in prose: "minted in PydanticAI's `process_tool_call`".
    '''minted in PydanticAI's''',
]
