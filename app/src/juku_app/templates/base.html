<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf }}">
  <title>{% block title %}Juku{% endblock %} · Juku</title>
  {{ stylesheet() }}
  <style>
    /* Before the stylesheet loads, and if it never does: readable, with the phone's own Japanese font (FE3). */
    body { font-family: system-ui, "Hiragino Sans", "Noto Sans CJK JP", "Yu Gothic", Meiryo, sans-serif;
           margin: 0 auto; max-width: 42rem; padding: 1rem; line-height: 1.6; }
    rt { font-size: 0.6em; }
  </style>
</head>
<body class="bg-stone-50 text-stone-900">
  {% if page %}
  <nav class="mb-4 flex flex-wrap gap-3 text-sm">
    <a href="/beranda">{{ _("Home") }}</a>
    <a href="/kuis">{{ _("Quiz") }}</a>
    <a href="/bacaan">{{ _("Reading") }}</a>
    <a href="/rencana">{{ _("Plan") }}</a>
    <a href="/chat">{{ _("Chat") }}</a>
    <a href="/pengaturan">{{ _("Settings") }}</a>
  </nav>
  {% endif %}
  <main>{% block content %}{% endblock %}</main>
  <footer class="mt-8 text-xs text-stone-500"><a href="/tentang-data">{{ _("About the data") }}</a></footer>
  {{ island("vitals") }}
</body>
</html>
