{% extends "base.html" %}
{% block title %}{{ _("Sign in") }}{% endblock %}
{% block content %}
<h1 class="text-xl font-bold">{{ _("Welcome to Juku") }}</h1>
<p>{{ _("Enter the invite code Arthur gave you.") }}</p>
{% if error %}<p role="alert" class="text-red-700">{{ _("Unknown code. Check it and try again.") }}</p>{% endif %}
<form method="post" action="/masuk">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>{{ _("Invite code") }} <input name="code" autocomplete="off" required class="border p-1"></label>
  <button type="submit" class="border px-3 py-1">{{ _("Sign in") }}</button>
</form>
{% endblock %}
