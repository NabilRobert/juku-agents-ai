[project]
name = "juku-app"
version = "0.0.0"
description = "Juku's web app: the pages, consent and privacy, the budget guard, and Shiori the chat agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "juku-common",
    "juku-data",
    "argon2-cffi==25.1.0",
    "babel==2.18.0",
    "fastapi==0.162.0",
    "itsdangerous==2.2.0",
    "jinja2==3.1.6",
    "opentelemetry-api==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "pydantic-ai-slim[mcp,openai]==2.56.0",
    "pydantic-settings==2.16.1",
    "python-multipart==0.0.32",
    "sse-starlette==3.6.0",
    "structlog==26.1.0",
    "typer==0.27.3",
    "uvicorn==0.54.0",
]

[project.scripts]
juku = "juku_app.cli:app"

[tool.uv.sources]
juku-common = { workspace = true }
juku-data = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/juku_app"]
